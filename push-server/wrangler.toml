name = "my-obligations-push"
main = "worker.js"
compatibility_date = "2026-09-01"

# أنشئ مساحة KV ثم ضع المعرف هنا:
#   cd push-server
#   npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# الأسرار تُضبط بأمر secret (لا تُكتب في هذا الملف):
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put VAPID_SUBJECT      # اختياري: mailto:you@example.com
